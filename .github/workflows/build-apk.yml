name: Build Flet Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

  # 18回目で完全に動作した環境をそのまま引き継いでいます
  steps:
    - name: 1. リポジトリのコードを取得
      uses: actions/checkout@v4

    - name: 2. Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. Javaのセットアップ
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. Flutterのセットアップ
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.7'

    - name: 5. Android SDKの環境設定
      uses: android-actions/setup-android@v3

    - name: 6. 必要なパッケージとビルド工具のインストール
      run: |
        python -m pip install --upgrade pip
        pip install "flet[cli]==0.85.2"

    - name: 7. Fletアプリ環境の初期化（あなたのmain.pyを守る修正）
      run: |
        # あなたが作ったmain.pyを上書きして消さないように、足りないファイルだけを自動補完させます
        flet create . --template app

    - name: 8. Flet APKのビルド実行（ターゲットを強制指定）
      run: |
        # あなたのmain.pyを確実に指定してビルドします
        flet build apk --target main.py

    - name: 9. 完成したAPKファイルを保存
      uses: actions/upload-artifact@v4
      with:
        name: ogata-field-tools-apk
        path: build/apk/*.apk
