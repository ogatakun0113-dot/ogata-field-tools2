name: Build Flet Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. リポジトリのコードを取得
      uses: actions/checkout@v4

    - name: 2. Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. Javaのセットアップ
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. Flutterのセットアップ
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.7'

    - name: 5. Android SDKの環境設定
      uses: android-actions/setup-android@v3

    - name: 6. 必要なパッケージとビルド工具のインストール
      run: |
        python -m pip install --upgrade pip
        pip install "flet[cli]==0.85.2"

    - name: 7. ルート直下にアプリ環境を再構築（フォルダ隔離バグの完全修正）
      run: |
        # スマホに古いアプリを強制上書きさせる設定ファイルを作成
        cat << 'EOF' > pyproject.toml
        [tool.flet]
        main_script = "main.py"
        dependencies = ["flet"]
        
        [tool.flet.android]
        build_number = 105
        version = "1.0.5"
        EOF
        
        # 本物のVSWR計算ツールのコードをルート直下に配置
        cat << 'EOF' > main.py
        import flet as ft
        import math

        def main(page: ft.Page):
            page.title = "VSWR計算ツール"
            page.padding = 20
            page.scroll = "adaptive"

            pf_input = ft.TextField(label="進行電力 Pf (W)", value="10")
            pr_input = ft.TextField(label="反射電力 Pr (W)", value="0.1")
            
            result_vswr = ft.Text(value="VSWR: --", size=24, color="blue", weight="bold")
            result_rho = ft.Text(value="反射係数 (Γ): --", size=16)

            def calculate_vswr(e):
                try:
                    pf = float(pf_input.value)
                    pr = float(pr_input.value)

                    if pf <= 0 or pr < 0 or pr > pf:
                        result_vswr.value = "エラー: 入力値が不正です"
                        page.update()
                        return

                    rho = math.sqrt(pr / pf)
                    vswr_val = (1 + rho) / (1 - rho)

                    result_vswr.value = f"VSWR: {vswr_val:.3f}"
                    result_rho.value = f"反射係数 (Γ): {rho:.4f}"
                except ValueError:
                    result_vswr.value = "エラー: 数値を入力してください"
                
                page.update()

            calc_button = ft.ElevatedButton("計算する", on_click=calculate_vswr)

            page.add(
                ft.Text("VSWR 計算ツール", size=24, weight="bold"),
                ft.Divider(),
                pf_input,
                pr_input,
                ft.Container(content=calc_button, margin=ft.margin.only(top=10, bottom=10)),
                ft.Divider(),
                result_vswr,
                result_rho
            )

        ft.app(target=main)
        EOF

    - name: 8. Flet APKのビルド実行（ルート上で直に実行）
      run: |
        flet build apk

    - name: 9. 完成したAPKファイルを保存
      uses: actions/upload-artifact@v4
      with:
        name: ogata-field-tools-apk
        path: build/apk/*.apk
